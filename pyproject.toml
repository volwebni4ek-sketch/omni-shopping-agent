[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omni-shopping-agent"
version = "0.1.0"
description = "Multi-channel UA/EU/Global shopping intelligence, landed cost calculator, statistical IQR funnel, Pareto/TOPSIS decision engine & HITL portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
omni-agent = "omni_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
